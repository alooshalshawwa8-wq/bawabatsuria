name: Validate portal
on:
  push:
    branches: [main, stabilize-portal]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
      - run: node --check api/chat.js
      - run: node --check sw.js
